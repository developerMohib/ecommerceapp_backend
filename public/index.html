<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | E-Commerce App</title>
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f8fafc;
            background: #0f172a;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 15% 10%, #3730a3 0, transparent 35%),
                        radial-gradient(circle at 85% 90%, #0e7490 0, transparent 35%), #0f172a;
        }

        .error-card {
            width: min(100%, 560px);
            padding: 52px 42px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 24px;
            background: rgba(15, 23, 42, .76);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
            backdrop-filter: blur(16px);
        }

        .icon {
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            border: 1px solid rgba(251, 191, 36, .35);
            border-radius: 50%;
            color: #fbbf24;
            font-size: 38px;
            font-weight: 800;
            background: rgba(251, 191, 36, .14);
        }

        .code { color: #94a3b8; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 10px 0 14px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.04em; }
        p { max-width: 410px; margin: 0 auto 28px; color: #cbd5e1; line-height: 1.7; }

        .button {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            background: #f8fafc;
            transition: transform .2s ease, background .2s ease;
        }

        .button:hover { transform: translateY(-2px); background: #e2e8f0; }
    </style>
</head>
<body>
    <main class="error-card" role="main">
        <div class="icon" aria-hidden="true">!</div>
        <div class="code"> <strong>Hi,</strong> This is SHOPORA Error Page </div>
        <h1>Welcome to SHOPORA Home Route</h1>
        <p>Let's get you back on track. or check - /health or /check - </p>
        <p>Our server hit an unexpected problem while processing your request. Please try again in a moment.</p>
    </main>
</body>
</html>
